<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vasileios Giannoulakos — Interactive Resume Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy-dark: #070B19;
    --navy-sidebar: #0B132B;
    --navy-content-bg: #111C3D;
    --gold-accent: #F2BB05;
    --gold-hover: #D1A104;
    --highlight: #FFF275;
  }
  * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body { background: var(--navy-dark); color: #E9ECEF; min-height: 100vh; }
  
  /* Filter Buttons Active State */
  .filter-btn.active { background-color: var(--gold-accent); color: var(--navy-dark); font-weight: 700; border-color: var(--gold-accent); }
  mark { background: var(--highlight); color: black; padding: 0 2px; border-radius: 2px; }

  /* Premium Sidebar Image Styling */
  #profile-img-container img { border: 3px solid var(--gold-accent); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

  /* Print Media Query Vector Enforcement */
  @media print {
    #toolbar, #filter-bar, #export-overlay, .interactive-media-btn, .project-btn { display: none !important; }
    body { background: white; padding: 0; color: #111C3D; }
    #resume-wrapper { margin: 0; max-width: 100%; box-shadow: none; display: grid; grid-template-columns: 280px 1fr; width: 210mm; min-height: 297mm; }
    #sidebar { background: #0B132B !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #main-content { background: #F8F9FA !important; color: #111C3D !important; }
    .exp-card { background: white !important; border: 1px solid #E2E8F0 !important; color: #111C3D !important; box-shadow: none !important; }
    .exp-bullet-text { color: #334155 !important; }
    @page { margin: 0; size: A4; }
  }
</style>
</head>
<body class="pt-20 bg-[#070B19]">

<div id="toolbar" class="fixed top-0 left-0 right-0 h-16 bg-[#0B132B] border-b-4 border-[#F2BB05] z-50 flex items-center justify-between px-6 shadow-xl">
  <div class="text-[#F2BB05] text-xs font-black tracking-widest uppercase hidden md:block">Vasileios Giannoulakos · Executive Platform</div>
  
  <div class="flex items-center gap-4 flex-1 max-w-md mx-4">
    <input type="text" id="search-input" placeholder="Αναζήτηση τεχνολογιών, apps, keywords..." oninput="handleSearch(this.value)" class="w-full bg-[#111C3D] text-white text-sm px-4 py-2 rounded border border-gray-700 outline-none focus:border-[#F2BB05] transition-all placeholder-gray-500" />
  </div>

  <div class="flex items-center gap-3">
    <div class="flex rounded overflow-hidden border border-gray-700">
      <button id="btn-en" onclick="setLang('en')" class="bg-transparent text-gray-400 text-xs px-3 py-1.5 font-bold tracking-wider hover:bg-[#111C3D] transition-all">EN</button>
      <button id="btn-el" onclick="setLang('el')" class="bg-transparent text-gray-400 text-xs px-3 py-1.5 font-bold tracking-wider hover:bg-[#111C3D] transition-all">ΕΛ</button>
    </div>
    
    <button onclick="window.print()" class="bg-transparent border border-gray-700 text-gray-300 hover:border-[#F2BB05] hover:text-[#F2BB05] text-xs px-3 py-1.5 rounded transition-all uppercase tracking-wider font-semibold">PDF</button>
    <button onclick="exportPNG()" class="bg-transparent border border-gray-700 text-gray-300 hover:border-[#F2BB05] hover:text-[#F2BB05] text-xs px-3 py-1.5 rounded transition-all uppercase tracking-wider font-semibold">PNG</button>
  </div>
</div>

<div id="export-overlay" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center flex-col gap-4 text-white font-semibold tracking-wide">
  <div class="w-10 h-10 border-4 border-gray-800 border-t-[#F2BB05] rounded-full animate-spin"></div>
  <span>Compiling High-Fidelity Design Matrix...</span>
</div>

<div id="resume-wrapper" class="max-w-6xl mx-auto bg-[#111C3D] shadow-2xl grid grid-cols-1 md:grid-cols-[320px_1fr] min-height-[297mm] my-6 transition-all duration-300 rounded-lg overflow-hidden border border-gray-800">
  
  <aside id="sidebar" class="bg-[#0B132B] text-gray-300 p-8 flex flex-col gap-8 border-r border-[#070B19]">
    
    <div class="border-b border-gray-800 pb-6 flex flex-col items-center text-center md:items-start md:text-left">
      <div id="profile-img-container" class="w-32 h-32 mb-4 rounded-full overflow-hidden shrink-0">
        <img id="profile-pic" src="profile_img.png" alt="Vasileios Giannoulakos Profile Image" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150x150?text=Vasilis'"/>
      </div>
      <h1 class="text-xl font-black text-white tracking-wide leading-tight mb-2 uppercase" id="s-name"></h1>
      <div class="text-[10px] font-extrabold tracking-widest text-[#F2BB05] uppercase mb-1" id="s-title"></div>
      <p class="text-[11px] text-gray-400 font-medium" id="s-tagline"></p>
    </div>

    <div>
      <div class="text-[10px] font-black tracking-widest text-[#F2BB05] uppercase mb-4 flex items-center gap-2 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-800" id="lbl-contact"></div>
      <div id="contact-container" class="space-y-3 text-xs font-light"></div>
    </div>

    <div>
      <div class="text-[10px] font-black tracking-widest text-[#F2BB05] uppercase mb-4 flex items-center gap-2 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-800" id="lbl-edu"></div>
      <div id="education-container" class="space-y-4"></div>
    </div>

    <div>
      <div class="text-[10px] font-black tracking-widest text-[#F2BB05] uppercase mb-4 flex items-center gap-2 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-800" id="lbl-skills"></div>
      <div id="skills-container" class="flex flex-wrap gap-1.5"></div>
    </div>

    <div>
      <div class="text-[10px] font-black tracking-widest text-[#F2BB05] uppercase mb-4 flex items-center gap-2 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-800" id="lbl-langs"></div>
      <div id="languages-container" class="space-y-3"></div>
    </div>
  </aside>

  <main id="main-content" class="bg-[#111C3D] p-8 flex flex-col gap-8">
    <div class="border-b-4 border-[#0B132B] pb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h2 class="text-3xl font-black text-white tracking-tight uppercase" id="m-name"></h2>
        <div class="text-xs font-bold tracking-widest text-[#F2BB05] uppercase mt-1" id="m-role"></div>
      </div>
      <div id="stats-container" class="flex gap-4 justify-start sm:justify-end"></div>
    </div>

    <div>
      <div class="text-xs font-black tracking-widest text-white uppercase mb-3 flex items-center gap-3 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-800" id="lbl-profile"></div>
      <p class="text-sm text-gray-300 leading-relaxed font-light text-justify" id="m-summary"></p>
    </div>

    <div id="filter-bar" class="flex flex-wrap gap-2 border-b border-gray-800 pb-4">
      <button onclick="filterCategory('all')" id="flt-all" class="filter-btn bg-[#0B132B] border border-gray-700 text-gray-300 text-xs px-4 py-2 rounded transition-all shadow-md hover:border-[#F2BB05] hover:text-white"></button>
      <button onclick="filterCategory('android')" id="flt-android" class="filter-btn bg-[#0B132B] border border-gray-700 text-gray-300 text-xs px-4 py-2 rounded transition-all shadow-md hover:border-[#F2BB05] hover:text-white">Android Engine</button>
      <button onclick="filterCategory('web')" id="flt-web" class="filter-btn bg-[#0B132B] border border-gray-700 text-gray-300 text-xs px-4 py-2 rounded transition-all shadow-md hover:border-[#F2BB05] hover:text-white">Custom PHP Platforms</button>
      <button onclick="filterCategory('security')" id="flt-security" class="filter-btn bg-[#0B132B] border border-gray-700 text-gray-300 text-xs px-4 py-2 rounded transition-all shadow-md hover:border-[#F2BB05] hover:text-white">Cybersecurity Layer</button>
    </div>

    <div>
      <div class="text-xs font-black tracking-widest text-white uppercase mb-6 flex items-center gap-3 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-800" id="lbl-exp"></div>
      <div id="experience-container" class="space-y-4"></div>
      <div id="no-results" class="text-center p-8 text-sm text-gray-400 font-light hidden bg-[#0B132B] rounded border border-dashed border-gray-700"></div>
    </div>
  </main>
</div>

<script>
// Cryptographic protection definitions
const _e = ["Z2lhbm5vdWxha29zdmFzaWxpb3NAZ21haWwuY29t"];
const _p = ["KzMwIDY5MCA5MzcgMDY1NA=="];
const extractData = (arr) => arr.map(s => atob(s)).join('');

// Runtime State Configuration
let appData = null;
let currentLang = 'el';
let activeCategory = 'all';
let searchQuery = '';

// Dom Core Async Hydration Trigger
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const response = await fetch('./resume.json');
    appData = await response.json();
    initializeEngine();
  } catch (err) {
    console.error("Platform Lifecycle Halt: JSON Parsing Execution Interrupted.", err);
    document.getElementById('resume-wrapper').innerHTML = `
      <div class="col-span-2 text-center p-12 bg-[#0B132B] rounded-lg shadow-2xl border border-red-900/50">
        <h2 class="text-xl font-bold text-red-500 mb-2">Local Resource Access Constraint (CORS)</h2>
        <p class="text-sm text-gray-400 font-light">Για τοπικό development, εκτελέστε έναν HTTP Server (π.χ. Live Server extension ή Python HTTP stack). Στο deployment του GitHub Pages θα παίξει απευθείας.</p>
      </div>`;
  }
});

function initializeEngine() {
  setLang(currentLang);
}

function render() {
  if (!appData) return;
  const content = appData[currentLang];
  const query = searchQuery.trim().toLowerCase();

  // Set Localized Sidebar Meta Information
  document.getElementById('s-name').textContent = content.profile.name;
  document.getElementById('s-title').textContent = content.profile.title;
  document.getElementById('s-tagline').textContent = content.profile.subtitle;

  // Hydrate Profile Image Node Location Selector
  if (content.profile.profile_img) {
    document.getElementById('profile-pic').src = content.profile.profile_img;
  }

  // Schema Framework Section Titles
  document.getElementById('lbl-contact').textContent = content.labels.contact;
  document.getElementById('lbl-edu').textContent = content.labels.education;
  document.getElementById('lbl-skills').textContent = content.labels.skills;
  document.getElementById('lbl-langs').textContent = content.labels.languages;
  document.getElementById('lbl-profile').textContent = content.labels.profile;
  document.getElementById('lbl-exp').textContent = content.labels.experience;
  document.getElementById('flt-all').textContent = content.labels.filterAll;

  // Primary Content Container Matrix Data Injection
  document.getElementById('m-name').innerHTML = content.profile.name;
  document.getElementById('m-role').textContent = content.profile.title;
  document.getElementById('m-summary').innerHTML = parseHighlights(content.profile.summary, query);

  // Performance Metric Nodes Mapping Matrix Loop
  document.getElementById('stats-container').innerHTML = content.stats.map(s => `
    <div class="text-center bg-[#0B132B] border border-gray-800 px-4 py-2 rounded shadow-lg min-w-[95px]">
      <div class="text-lg font-black text-[#F2BB05] leading-none">${s.num}</div>
      <div class="text-[9px] font-bold text-gray-400 tracking-widest uppercase mt-1">${s.label}</div>
    </div>
  `).join('');

  // Encrypted Communication Nodes Mapping Rendering Loop
  document.getElementById('contact-container').innerHTML = `
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">📍</span><span class="text-gray-400">${content.contact.location}</span></div>
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">✉</span><a href="mailto:${extractData(_e)}" class="text-gray-200 hover:text-[#F2BB05] transition-all">${extractData(_e)}</a></div>
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">☎</span><span class="text-gray-400">${extractData(_p)}</span></div>
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">💻</span><a href="https://${content.contact.github}" target="_blank" class="text-gray-200 hover:text-[#F2BB05] transition-all">${content.contact.github}</a></div>
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">👔</span><a href="https://${content.contact.linkedin}" target="_blank" class="text-gray-200 hover:text-[#F2BB05] transition-all">LinkedIn Connection</a></div>
  `;

  // Education Sub-nodes Iterative Template
  document.getElementById('education-container').innerHTML = content.education.map(e => `
    <div class="border-l-2 border-gray-700 pl-3 py-0.5">
      <div class="text-xs font-bold text-white leading-tight">${e.degree}</div>
      <div class="text-[11px] text-gray-400 mt-0.5">${e.school}</div>
      <div class="text-[10px] font-semibold text-[#F2BB05] mt-1 tracking-wider">${e.year}</div>
      <div class="text-[10px] text-gray-500 mt-0.5 font-light">${e.direction}</div>
    </div>
  `).join('');

  // Skills Tags Architecture Implementation Engine
  document.getElementById('skills-container').innerHTML = content.skills.map(sk => {
    const isMatchedQuery = query && sk.toLowerCase().includes(query);
    return `
      <span class="text-[10px] font-semibold px-2 py-1 rounded transition-all border ${
        isMatchedQuery 
          ? 'bg-[#F2BB05] border-[#F2BB05] text-[#0B132B] font-bold scale-105 shadow-xl' 
          : 'bg-[#111C3D] border-gray-800 text-gray-400 hover:text-white hover:border-gray-600'
      }">${parseHighlights(sk, query)}</span>
    `;
  }).join('');

  // Language Array Elements Subsystem Grid Compilation Loop
  document.getElementById('languages-container').innerHTML = content.languages.map(l => `
    <div>
      <div class="flex justify-between text-xs mb-1">
        <span class="text-white font-medium">${l.name}</span>
        <span class="text-gray-400 text-[11px] font-light tracking-wide">${l.level}</span>
      </div>
      <div class="w-full h-1.5 bg-[#111C3D] rounded-full overflow-hidden">
        <div class="h-full bg-[#F2BB05] rounded-full" style="width: ${l.pct}%"></div>
      </div>
    </div>
  `).join('');

  // Centralized Matrix Experience Filter Parser Pipeline
  let calculatedRenderedItems = 0;
  document.getElementById('experience-container').innerHTML = content.experience.map(item => {
    const validCategoryConstraint = (activeCategory === 'all' || item.category === activeCategory);
    
    // Evaluate verification variables
    const matchesHeaderQuery = item.role.toLowerCase().includes(query) || item.company.toLowerCase().includes(query);
    const validMatchesFoundInBullets = item.bullets.some(b => b.toLowerCase().includes(query));
    
    const validGlobalSearchConstraint = (!query || matchesHeaderQuery || validMatchesFoundInBullets);
    const nodeOutputVisibilityState = validCategoryConstraint && validGlobalSearchConstraint;

    if (nodeOutputVisibilityState) calculatedRenderedItems++;

    // Sub-loop layout compiling process
    const arrayBulletsHtml = item.bullets.map(b => {
      const activeTextSelectionMatches = !query || b.toLowerCase().includes(query) || matchesHeaderQuery;
      return `
        <li class="flex items-start gap-2 text-xs text-gray-300 font-light leading-relaxed exp-bullet-text ${activeTextSelectionMatches ? '' : 'opacity-25'}">
          <span class="text-[#F2BB05] font-black select-none mt-0.5">—</span>
          <span>${parseHighlights(b, query)}</span>
        </li>`;
    }).join('');

    // Media Routing Node Configuration
    const dynamicMediaButtonHtml = item.media_url ? `
      <a href="${item.media_url}" target="_blank" class="interactive-media-btn bg-[#0B132B] border border-gray-700 hover:border-[#F2BB05] text-white hover:text-[#F2BB05] text-[10px] font-bold px-3 py-1.5 rounded flex items-center gap-1.5 shadow-md transition-all">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        ${content.labels.mediaBtn}
      </a>
    ` : '';

    // Project Hyperlink Buttons Matrix Allocation
    const actionLinksHtml = item.links && item.links.length > 0 ? item.links.map(l => `
      <a href="${l.url}" target="_blank" class="bg-[#111C3D] border border-gray-800 hover:border-white text-gray-300 hover:text-white text-[10px] font-bold px-3 py-1.5 rounded flex items-center gap-1.5 shadow-md transition-all">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        ${l.name}
      </a>
    `).join('') : '';

    const thumbnailBoxPreviewHtml = item.image ? `
      <div class="w-full sm:w-28 h-20 rounded border border-gray-800 overflow-hidden shadow-lg shrink-0 hidden sm:block bg-[#0B132B]">
        <img src="${item.image}" alt="Deployment Resource Graphic Preview" class="w-full h-full object-cover shadow-inner" />
      </div>
    ` : '';

    return `
      <div class="bg-[#0B132B] border border-gray-800 rounded p-6 shadow-xl flex flex-col sm:flex-row gap-5 hover:border-gray-700 transition-all duration-300 exp-card ${nodeOutputVisibilityState ? 'flex' : '!hidden'}">
        ${thumbnailBoxPreviewHtml}
        <div class="flex-1">
          <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-1 mb-3">
            <div>
              <h3 class="text-sm font-bold text-white flex items-center gap-2 flex-wrap">
                ${parseHighlights(item.role, query)}
                <span class="text-[11px] bg-[#F2BB05] text-[#0B132B] px-2 py-0.5 rounded font-black tracking-wide uppercase border border-[#F2BB05] shadow-sm">${parseHighlights(item.company, query)}</span>
              </h3>
            </div>
            <div class="text-[10px] font-bold text-gray-500 tracking-widest uppercase">${item.period}</div>
          </div>
          <ul class="space-y-2 mt-2">${arrayBulletsHtml}</ul>
          <div class="flex flex-wrap gap-2 mt-4 project-btn">
            ${actionLinksHtml}
            ${dynamicMediaButtonHtml}
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Exception handling for unmapped queries
  const errorContainerNode = document.getElementById('no-results');
  if (calculatedRenderedItems === 0) {
    errorContainerNode.classList.remove('hidden');
    errorContainerNode.textContent = `${content.labels.noResults} "${searchQuery}"`;
  } else {
    errorContainerNode.classList.add('hidden');
  }

  // Active Style Class Hydrator Toggles Switches
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  const targetCategoryFilterButton = document.getElementById(`flt-${activeCategory}`);
  if (targetCategoryFilterButton) targetCategoryFilterButton.classList.add('active');

  document.getElementById('btn-en').classList.toggle('bg-[#111C3D]', currentLang === 'en');
  document.getElementById('btn-en').classList.toggle('text-white', currentLang === 'en');
  document.getElementById('btn-el').classList.toggle('bg-[#111C3D]', currentLang === 'el');
  document.getElementById('btn-el').classList.toggle('text-white', currentLang === 'el');
  document.documentElement.lang = currentLang;
}

function parseHighlights(text, searchWord) {
  if (!searchWord) return text;
  const sanitisedRegExInput = searchWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${sanitisedRegExInput})`, 'gi'), '<mark>$1</mark>');
}

// User-Facing Interactive Controls
function setLang(langCode) {
  currentLang = langCode;
  render();
}

function handleSearch(inputValue) {
  searchQuery = inputValue;
  render();
}

function filterCategory(categoryKey) {
  activeCategory = categoryKey;
  render();
}

// High-Resolution Export Engine
async function exportPNG() {
  const runtimeOverlayMaskNode = document.getElementById('export-overlay');
  runtimeOverlayMaskNode.style.display = 'flex';
  await new Promise(r => setTimeout(r, 200));
  try {
    const rawBitmapCanvas = await html2canvas(document.getElementById('resume-wrapper'), {
      scale: 2,
      useCORS: true,
      backgroundColor: '#111C3D',
      logging: false
    });
    const downloadPipeAnchor = document.createElement('a');
    downloadPipeAnchor.download = `Resume_Vasileios_Giannoulakos.png`;
    downloadPipeAnchor.href = rawBitmapCanvas.toDataURL('image/png');
    downloadPipeAnchor.click();
  } catch (err) {
    console.error("Bitmap Rasterization Error: Conversion stack failed to calculate target elements vector values.", err);
  }
  runtimeOverlayMaskNode.style.display = 'none';
}
</script>
</body>
</html>
