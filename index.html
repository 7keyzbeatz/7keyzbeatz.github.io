<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vasileios Giannoulakos — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #060A18;
  --bg2: #0C1428;
  --bg3: #111E3A;
  --gold: #F2BB05;
  --gold2: #FFD966;
  --gold-dim: rgba(242,187,5,0.12);
  --gold-glow: rgba(242,187,5,0.35);
  --text: #E8EDF7;
  --muted: #6B7A99;
  --border: rgba(255,255,255,0.07);
  --card: rgba(12,20,40,0.85);
  --red: #FF4757;
  --green: #2ED573;
  --blue: #1E90FF;
  --purple: #A855F7;
  --radius: 16px;
  --sidebar: 320px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  line-height:1.6;
  overflow-x:hidden;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px;}

/* NOISE OVERLAY */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4;
}

/* LAYOUT */
#app{display:flex;min-height:100vh;position:relative;z-index:1;}

/* SIDEBAR */
#sidebar{
  width:var(--sidebar);
  min-width:var(--sidebar);
  background:var(--bg2);
  border-right:1px solid var(--border);
  position:sticky;
  top:0;height:100vh;
  overflow-y:auto;
  display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  scrollbar-width:none;
}
#sidebar::-webkit-scrollbar{display:none;}

.sidebar-inner{padding:32px 24px;display:flex;flex-direction:column;gap:28px;min-height:100%;}

/* PROFILE */
.profile-block{text-align:center;}
.avatar-wrap{
  width:110px;height:110px;
  border-radius:50%;
  margin:0 auto 16px;
  position:relative;
  display:inline-block;
}
.avatar-wrap::before{
  content:'';
  position:absolute;inset:-3px;
  border-radius:50%;
  background:conic-gradient(var(--gold),var(--gold2),var(--gold),transparent 60%,var(--gold));
  animation:spin 4s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.avatar-wrap img{
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  position:relative;z-index:1;
  border:3px solid var(--bg2);
}
.profile-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:2px;
  color:#fff;line-height:1.1;
  margin-bottom:6px;
}
.profile-title{
  font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:2px;
  color:var(--gold);margin-bottom:4px;
}
.profile-sub{font-size:11px;color:var(--muted);font-weight:300;}

/* STATS ROW */
.stats-row{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.stat-box{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 8px;
  text-align:center;
}
.stat-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;color:var(--gold);letter-spacing:1px;
}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);}

/* SIDEBAR SECTIONS */
.s-section{display:flex;flex-direction:column;gap:10px;}
.s-label{
  font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:2.5px;
  color:var(--gold);
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.s-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* CONTACT ITEMS */
.contact-item{
  display:flex;align-items:center;gap:10px;
  font-size:12px;color:var(--text);
  text-decoration:none;
  padding:7px 10px;
  border-radius:8px;
  transition:all .2s;
  border:1px solid transparent;
}
.contact-item:hover{background:var(--gold-dim);border-color:var(--gold-glow);color:var(--gold);}
.contact-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);border-radius:7px;font-size:13px;flex-shrink:0;}

/* SKILLS CHIPS */
.skills-cloud{display:flex;flex-wrap:wrap;gap:6px;}
.skill-chip{
  font-size:10px;font-weight:600;
  padding:4px 10px;border-radius:20px;
  background:var(--bg3);
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
  transition:all .2s;
  white-space:nowrap;
}
.skill-chip:hover,.skill-chip.active{
  background:var(--gold);color:var(--bg);
  border-color:var(--gold);
  transform:translateY(-1px);
  box-shadow:0 4px 12px var(--gold-glow);
}

/* LANGUAGE BARS */
.lang-item{margin-bottom:12px;}
.lang-meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.lang-level{color:var(--muted);font-size:11px;}
.lang-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.lang-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;
  width:0;transition:width 1.2s cubic-bezier(.4,0,.2,1);}

/* MAIN CONTENT */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}

/* TOP BAR */
#topbar{
  position:sticky;top:0;
  background:rgba(6,10,24,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  z-index:100;
  padding:0 32px;
  height:60px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.search-wrap{
  flex:1;max-width:380px;
  position:relative;
}
.search-wrap svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;
}
#search-input{
  width:100%;
  background:var(--bg3);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 12px 8px 38px;
  border-radius:10px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  outline:none;
  transition:border-color .2s;
}
#search-input:focus{border-color:var(--gold);}
#search-input::placeholder{color:var(--muted);}

.topbar-right{display:flex;align-items:center;gap:10px;}
.lang-toggle{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
.lang-btn{
  background:transparent;color:var(--muted);
  font-size:11px;font-weight:700;
  padding:6px 14px;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  letter-spacing:1px;
  transition:all .2s;border:none;
}
.lang-btn.active{background:var(--gold);color:var(--bg);}
#hamburger{
  display:none;background:transparent;border:1px solid var(--border);
  color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer;
  font-size:18px;
}

/* HERO SECTION */
#hero{
  padding:48px 40px 32px;
  position:relative;
  overflow:hidden;
}
#hero::before{
  content:'';
  position:absolute;top:-80px;right:-80px;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(242,187,5,0.08) 0%,transparent 70%);
  pointer-events:none;
}
.hero-eyebrow{
  font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:4px;
  color:var(--gold);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.hero-eyebrow::before{content:'';width:24px;height:2px;background:var(--gold);}
.hero-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(42px,6vw,80px);
  line-height:.95;
  letter-spacing:3px;
  color:#fff;
  margin-bottom:8px;
}
.hero-name span{color:var(--gold);}
.hero-role{
  font-size:14px;color:var(--muted);
  margin-bottom:20px;
  font-weight:300;
}
.hero-bio{
  font-size:14px;color:var(--text);
  max-width:680px;
  line-height:1.7;
  opacity:.85;
  margin-bottom:28px;
}
.hero-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px;}
.btn-gold{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--gold);color:var(--bg);
  font-weight:700;font-size:12px;
  text-transform:uppercase;letter-spacing:1.5px;
  padding:10px 20px;border-radius:10px;
  text-decoration:none;
  transition:all .25s;
  border:none;cursor:pointer;
}
.btn-gold:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 8px 24px var(--gold-glow);}
.btn-outline{
  display:inline-flex;align-items:center;gap:7px;
  background:transparent;color:var(--text);
  font-weight:600;font-size:12px;
  text-transform:uppercase;letter-spacing:1.5px;
  padding:10px 20px;border-radius:10px;
  text-decoration:none;
  border:1px solid var(--border);
  transition:all .25s;
}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}

/* SECTION TITLE */
.sec-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;letter-spacing:2px;color:#fff;
  margin-bottom:6px;
}
.sec-sub{font-size:12px;color:var(--muted);margin-bottom:20px;}

/* FILTER TABS */
.filter-bar{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-bottom:24px;
  padding:0 40px;
}
.filter-tab{
  font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:1.5px;
  padding:7px 16px;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;color:var(--muted);
  cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .2s;
}
.filter-tab:hover{border-color:var(--gold);color:var(--gold);}
.filter-tab.active{background:var(--gold);color:var(--bg);border-color:var(--gold);}

/* CONTENT SECTIONS */
.content-section{padding:0 40px 48px;}

/* EXPERIENCE CARDS */
.exp-grid{display:flex;flex-direction:column;gap:16px;}
.exp-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  opacity:1;
  transform:translateY(0);
}
.exp-card.hidden{display:none;}
.exp-card:hover{
  border-color:rgba(242,187,5,0.3);
  box-shadow:0 8px 40px rgba(0,0,0,0.4),0 0 0 1px rgba(242,187,5,0.1);
  transform:translateY(-2px);
}
.exp-card-header{
  display:flex;gap:0;
  position:relative;
}
.exp-thumb{
  width:120px;min-width:120px;height:100px;
  object-fit:cover;
  flex-shrink:0;
}
.exp-thumb-placeholder{
  width:120px;min-width:120px;height:100px;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
  flex-shrink:0;
}
.exp-header-info{
  flex:1;padding:16px 20px 12px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.exp-cat-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:2px;
  padding:3px 9px;border-radius:20px;
  margin-bottom:6px;
  align-self:flex-start;
}
.exp-role{
  font-weight:700;font-size:15px;color:#fff;
  line-height:1.2;margin-bottom:4px;
}
.exp-company{font-size:12px;color:var(--gold);font-weight:600;}
.exp-period{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:4px;}
.exp-expand-icon{
  position:absolute;right:16px;top:16px;
  width:28px;height:28px;
  background:var(--bg3);border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:transform .3s;color:var(--muted);
}
.exp-card.open .exp-expand-icon{transform:rotate(180deg);color:var(--gold);}

.exp-body{
  max-height:0;overflow:hidden;
  transition:max-height .45s cubic-bezier(.4,0,.2,1);
  border-top:0px solid transparent;
}
.exp-card.open .exp-body{
  max-height:2000px;
  border-top:1px solid var(--border);
}
.exp-body-inner{padding:20px 20px 20px 20px;}
.exp-bullets{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.exp-bullet{
  display:flex;align-items:flex-start;gap:10px;
  font-size:13px;color:#C5CDDF;line-height:1.5;
}
.exp-bullet::before{content:'—';color:var(--gold);font-weight:900;flex-shrink:0;margin-top:1px;}

/* MEDIA SECTION inside card */
.exp-media{margin-top:16px;}
.exp-media-title{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:2px;color:var(--muted);margin-bottom:10px;
}
.media-grid{display:flex;flex-wrap:wrap;gap:10px;}

/* IMAGE viewer */
.media-img-thumb{
  width:80px;height:60px;
  border-radius:8px;object-fit:cover;
  border:1px solid var(--border);
  cursor:pointer;
  transition:all .2s;
}
.media-img-thumb:hover{border-color:var(--gold);transform:scale(1.05);}

/* YOUTUBE embed */
.yt-embed{
  position:relative;border-radius:10px;overflow:hidden;
  background:#000;aspect-ratio:16/9;width:100%;max-width:380px;
  margin-bottom:10px;
}
.yt-embed iframe{width:100%;height:100%;border:0;}

/* LINKS ROW */
.exp-links{display:flex;flex-wrap:wrap;gap:8px;}
.exp-link{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;
  padding:7px 14px;border-radius:8px;
  text-decoration:none;
  border:1px solid var(--border);
  color:var(--text);
  transition:all .2s;
}
.exp-link:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}
.exp-link.primary{background:var(--gold);color:var(--bg);border-color:var(--gold);}
.exp-link.primary:hover{background:var(--gold2);}

/* SKILLS SECTION */
.skills-section{padding:0 40px 48px;}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.skill-card{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 14px 12px;
  transition:all .25s;
  cursor:default;
  position:relative;overflow:hidden;
}
.skill-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--gold);transform:scaleX(0);transform-origin:left;
  transition:transform .3s;
}
.skill-card:hover{border-color:rgba(242,187,5,0.3);transform:translateY(-2px);}
.skill-card:hover::after{transform:scaleX(1);}
.skill-icon{font-size:22px;margin-bottom:8px;}
.skill-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:3px;}
.skill-cat{font-size:10px;color:var(--muted);}

/* CERTS */
.certs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.cert-card{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  display:flex;gap:14px;
  align-items:flex-start;
  transition:all .25s;
}
.cert-card:hover{border-color:rgba(242,187,5,0.3);transform:translateY(-2px);}
.cert-icon{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.cert-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:3px;}
.cert-issuer{font-size:11px;color:var(--gold);margin-bottom:3px;}
.cert-year{font-size:10px;color:var(--muted);}
.cert-link{
  font-size:10px;color:var(--blue);
  text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-top:5px;
}
.cert-link:hover{text-decoration:underline;}

/* LIGHTBOX */
#lightbox{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.92);
  z-index:9999;
  display:none;
  align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
}
#lightbox.show{display:flex;}
#lightbox img{max-width:90vw;max-height:85vh;border-radius:12px;box-shadow:0 20px 80px rgba(0,0,0,.8);}
#lightbox-close{
  position:absolute;top:20px;right:24px;
  font-size:28px;color:#fff;cursor:pointer;
  background:rgba(255,255,255,0.1);width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  transition:background .2s;
}
#lightbox-close:hover{background:rgba(255,255,255,0.2);}

/* NO RESULTS */
.no-results{
  text-align:center;padding:48px 20px;
  color:var(--muted);font-size:14px;
  display:none;
}
.no-results.show{display:block;}

/* MARK HIGHLIGHT */
mark{background:var(--gold);color:var(--bg);padding:0 2px;border-radius:2px;}

/* SECTION DIVIDER */
.sec-divider{
  height:1px;background:var(--border);
  margin:0 40px 40px;
}

/* CATEGORY COLORS */
.cat-android{background:rgba(46,213,115,0.12);color:var(--green);border-color:rgba(46,213,115,0.2);}
.cat-web{background:rgba(30,144,255,0.12);color:var(--blue);border-color:rgba(30,144,255,0.2);}
.cat-security{background:rgba(168,85,247,0.12);color:var(--purple);border-color:rgba(168,85,247,0.2);}
.cat-game{background:rgba(255,71,87,0.12);color:var(--red);border-color:rgba(255,71,87,0.2);}
.cat-music{background:rgba(242,187,5,0.12);color:var(--gold);border-color:rgba(242,187,5,0.2);}
.cat-design{background:rgba(255,144,30,0.12);color:#FF901E;border-color:rgba(255,144,30,0.2);}

/* MOBILE OVERLAY */
#sidebar-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);
  z-index:199;
  backdrop-filter:blur(4px);
}

/* ANIMATIONS */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}
.fade-up{animation:fadeUp .5s ease forwards;}
.fade-up-1{animation-delay:.05s;opacity:0;}
.fade-up-2{animation-delay:.1s;opacity:0;}
.fade-up-3{animation-delay:.15s;opacity:0;}
.fade-up-4{animation-delay:.2s;opacity:0;}
.fade-up-5{animation-delay:.25s;opacity:0;}

/* RESPONSIVE */
@media(max-width:900px){
  :root{--sidebar:280px;}
  #hero{padding:32px 20px 24px;}
  .content-section,.skills-section,.filter-bar{padding-left:20px;padding-right:20px;}
  .sec-divider{margin-left:20px;margin-right:20px;}
  #topbar{padding:0 16px;}
}
@media(max-width:700px){
  #sidebar{
    position:fixed;left:0;top:0;bottom:0;
    transform:translateX(-100%);
    z-index:200;
  }
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay.show{display:block;}
  #hamburger{display:block;}
  #app{flex-direction:column;}
  #main{width:100%;}
  .exp-thumb,.exp-thumb-placeholder{width:80px;min-width:80px;height:80px;}
  .hero-name{font-size:38px;}
  .stats-row{grid-template-columns:1fr 1fr 1fr;}
  .skills-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  .certs-grid{grid-template-columns:1fr;}
}
@media(max-width:420px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .exp-card-header{flex-wrap:wrap;}
  .exp-thumb,.exp-thumb-placeholder{width:100%;height:120px;min-width:unset;}
}
</style>
</head>
<body>
<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<div id="lightbox" onclick="closeLightbox()">
  <div id="lightbox-close" onclick="closeLightbox()">✕</div>
  <img id="lightbox-img" src="" alt=""/>
</div>

<div id="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-inner">
      <div class="profile-block fade-up fade-up-1">
        <div class="avatar-wrap">

        <div class="exp-card-header">
          ${item.thumb_img

            ${mediaHtml}
            ${linksHtml}
          </div>
        </div>
      </div>`;
  }).join('');

  const nr = document.getElementById('no-results');
  if(shown===0){nr.classList.add('show');nr.textContent=`${d.labels.no_results} "${searchQ}"`;}
  else{nr.classList.remove('show');}

  // Skills full grid
  document.getElementById('skills-full-grid').innerHTML = d.skills_full.map(s=>`
    <div class="skill-card">
      <div class="skill-icon">${s.icon}</div>
      <div class="skill-name">${s.name}</div>
      <div class="skill-cat">${s.cat}</div>
    </div>`).join('');

  // Certifications
  document.getElementById('certs-grid').innerHTML = d.certifications.map(c=>`
    <div class="cert-card">
      <div class="cert-icon" style="background:${c.color}22;border:1px solid ${c.color}44;">
        <span>${c.icon}</span>
      </div>
      <div>
        <div class="cert-name">${c.name}</div>
        <div class="cert-issuer">${c.issuer}</div>
        <div class="cert-year">${c.year}</div>
        ${c.url?`<a class="cert-link" href="${c.url}" target="_blank">View ↗</a>`:''}
      </div>
    </div>`).join('');

  // Lang buttons
  document.getElementById('btn-en').classList.toggle('active',lang==='en');
  document.getElementById('btn-el').classList.toggle('active',lang==='el');
}

function hl(text, q){
  if(!q) return text;
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp(`(${safe})`,'gi'),'<mark>$1</mark>');
}

// ──────────────────────────────────────────────
// INTERACTIONS
// ──────────────────────────────────────────────
function setLang(l){ lang=l; render(); }
function setFilter(f){ activeFilter=f; render(); }
function searchSkill(s){ document.getElementById('search-input').value=s; searchQ=s; render(); }
document.getElementById('search-input').addEventListener('input', e=>{ searchQ=e.target.value; render(); });

function toggleCard(id){
  if(openCards.has(id)) openCards.delete(id);
  else openCards.add(id);
  const card = document.getElementById('card-'+id);
  if(card) card.classList.toggle('open', openCards.has(id));
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLightbox(); });

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
render();
</script>
</body>
</html>
