<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vasileios Giannoulakos — Interactive Resume Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy-dark: #0B132B;
    --navy-sidebar: #1C2541;
    --gold-accent: #F2BB05;
    --gold-hover: #D1A104;
    --text-main: #333333;
    --bg-light: #F8F9FA;
    --highlight: #FFF275;
  }
  * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body { background: #E9ECEF; color: var(--text-main); min-height: 100vh; }
  
  /* Navigation Active Highlight */
  .filter-btn.active { background-color: var(--gold-accent); color: var(--navy-dark); font-weight: 600; }
  mark { background: var(--highlight); color: black; padding: 0 2px; border-radius: 2px; }

  /* Print System Optimization */
  @media print {
    #toolbar, #filter-bar, #export-overlay, .project-btn { display: none !important; }
    body { background: white; padding: 0; }
    #resume-wrapper { margin: 0; max-width: 100%; box-shadow: none; display: grid; grid-template-columns: 280px 1fr; width: 210mm; min-height: 297mm; }
    #sidebar { background: var(--navy-sidebar) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { margin: 0; size: A4; }
  }
</style>
</head>
<body class="pt-20">

<div id="toolbar" class="fixed top-0 left-0 right-0 h-16 bg-[#0B132B] border-b-4 border-[#F2BB05] z-50 flex items-center justify-between px-6 shadow-md">
  <div class="text-white text-xs font-bold tracking-widest uppercase hidden sm:block">Vasileios Giannoulakos · SPA Platform</div>
  
  <div class="flex items-center gap-4 flex-1 max-w-md mx-4">
    <input type="text" id="search-input" placeholder="Αναζήτηση τεχνολογιών, apps, roles..." oninput="handleSearch(this.value)" class="w-full bg-[#1C2541] text-white text-sm px-4 py-2 rounded border border-gray-700 outline-none focus:border-[#F2BB05] transition-all" />
  </div>

  <div class="flex items-center gap-3">
    <div class="flex rounded overflow-hidden border border-gray-700">
      <button id="btn-en" onclick="setLang('en')" class="bg-transparent text-gray-400 text-xs px-3 py-1.5 font-semibold tracking-wider hover:bg-[#1C2541] transition-all">EN</button>
      <button id="btn-el" onclick="setLang('el')" class="bg-transparent text-gray-400 text-xs px-3 py-1.5 font-semibold tracking-wider hover:bg-[#1C2541] transition-all">ΕΛ</button>
    </div>
    
    <button onclick="window.print()" class="bg-transparent border border-gray-700 text-gray-300 hover:border-[#F2BB05] hover:text-[#F2BB05] text-xs px-3 py-1.5 rounded transition-all uppercase tracking-wider font-medium">PDF</button>
    <button onclick="exportPNG()" class="bg-transparent border border-gray-700 text-gray-300 hover:border-[#F2BB05] hover:text-[#F2BB05] text-xs px-3 py-1.5 rounded transition-all uppercase tracking-wider font-medium">PNG</button>
  </div>
</div>

<div id="export-overlay" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center flex-col gap-4 text-white font-medium tracking-wide">
  <div class="w-10 h-10 border-4 border-gray-700 border-t-[#F2BB05] rounded-full animate-spin"></div>
  <span>Rendering High-Resolution Canvas...</span>
</div>

<div id="resume-wrapper" class="max-w-6xl mx-auto bg-white shadow-2xl grid grid-cols-1 md:grid-cols-[300px_1fr] min-height-[297mm] my-6 transition-all duration-300">
  
  <aside id="sidebar" class="bg-[#1C2541] text-gray-300 p-8 flex flex-col gap-8 border-r border-[#0B132B]">
    <div class="border-b border-gray-700 pb-6">
      <h1 class="text-2xl font-black text-white tracking-wide leading-tight mb-2" id="s-name"></h1>
      <div class="text-[11px] font-bold tracking-widest text-[#F2BB05] uppercase mb-3" id="s-title"></div>
      <p class="text-xs text-gray-400 leading-relaxed font-light" id="s-tagline"></p>
    </div>

    <div>
      <div class="text-[10px] font-bold tracking-widest text-[#F2BB05] uppercase mb-4 flex items-center gap-2 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-700" id="lbl-contact"></div>
      <div id="contact-container" class="space-y-3 text-xs font-light"></div>
    </div>

    <div>
      <div class="text-[10px] font-bold tracking-widest text-[#F2BB05] uppercase mb-4 flex items-center gap-2 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-700" id="lbl-edu"></div>
      <div id="education-container" class="space-y-4"></div>
    </div>

    <div>
      <div class="text-[10px] font-bold tracking-widest text-[#F2BB05] uppercase mb-4 flex items-center gap-2 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-700" id="lbl-skills"></div>
      <div id="skills-container" class="flex flex-wrap gap-1.5"></div>
    </div>

    <div>
      <div class="text-[10px] font-bold tracking-widest text-[#F2BB05] uppercase mb-4 flex items-center gap-2 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-700" id="lbl-langs"></div>
      <div id="languages-container" class="space-y-3"></div>
    </div>
  </aside>

  <main id="main-content" class="bg-[#F8F9FA] p-8 flex flex-col gap-8">
    <div class="border-b-4 border-[#0B132B] pb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h2 class="text-4xl font-black text-[#0B132B] tracking-tight uppercase" id="m-name"></h2>
        <div class="text-sm font-semibold tracking-wider text-gray-500 uppercase mt-1" id="m-role"></div>
      </div>
      <div id="stats-container" class="flex gap-6 justify-start sm:justify-end"></div>
    </div>

    <div>
      <div class="text-xs font-bold tracking-widest text-[#text-main] uppercase mb-3 flex items-center gap-3 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-300" id="lbl-profile"></div>
      <p class="text-sm text-gray-700 leading-relaxed font-light text-justify" id="m-summary"></p>
    </div>

    <div id="filter-bar" class="flex flex-wrap gap-2 border-b border-gray-200 pb-4">
      <button onclick="filterCategory('all')" id="flt-all" class="filter-btn bg-white border border-gray-300 text-gray-700 text-xs px-4 py-2 rounded transition-all shadow-sm hover:border-[#F2BB05]"></button>
      <button onclick="filterCategory('android')" id="flt-android" class="filter-btn bg-white border border-gray-300 text-gray-700 text-xs px-4 py-2 rounded transition-all shadow-sm hover:border-[#F2BB05]">Android Architecture</button>
      <button onclick="filterCategory('web')" id="flt-web" class="filter-btn bg-white border border-gray-300 text-gray-700 text-xs px-4 py-2 rounded transition-all shadow-sm hover:border-[#F2BB05]">Custom Web / PHP</button>
      <button onclick="filterCategory('security')" id="flt-security" class="filter-btn bg-white border border-gray-300 text-gray-700 text-xs px-4 py-2 rounded transition-all shadow-sm hover:border-[#F2BB05]">Cybersecurity & Protection</button>
    </div>

    <div>
      <div class="text-xs font-bold tracking-widest text-[#text-main] uppercase mb-6 flex items-center gap-3 after:content-[''] after:flex-1 after:h-[1px] after:bg-gray-300" id="lbl-exp"></div>
      <div id="experience-container" class="space-y-6"></div>
      <div id="no-results" class="text-center p-8 text-sm text-gray-500 font-light hidden bg-white rounded border border-dashed border-gray-300"></div>
    </div>
  </main>
</div>

<script>
// Obfuscated Database Strings (Prevents web scraping crawlers)
const _e = ["Z2lhbm5vdWxha29zdmFzaWxpb3NAZ21haWwuY29t"]; // giannoulakosvasilios@gmail.com
const _p = ["KzMwIDY5MCA5MzcgMDY1NA=="]; // +30 690 937 0654
const parseSecure = (arr) => arr.map(s => atob(s)).join('');

// Global Application Core State
let appData = null;
let currentLang = 'el';
let activeCategory = 'all';
let searchQuery = '';

// Async Fetch Engine Initiation
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const response = await fetch('./resume.json');
    appData = await response.json();
    initPlatform();
  } catch (error) {
    console.error("Platform Critical Failure: Unable to fetch resume database schema.", error);
    document.getElementById('resume-wrapper').innerHTML = `
      <div class="col-span-2 text-center p-12 bg-white rounded-lg shadow-xl">
        <h2 class="text-xl font-bold text-red-600 mb-2">CORS API / Resource Loading Error</h2>
        <p class="text-sm text-gray-600 font-light">Για τοπικές δοκιμές, απαιτείται η χρήση τοπικού server (π.χ. Live Server στο VS Code ή python -m http.server). Στο GitHub Pages θα εκτελεστεί αυτόματα.</p>
      </div>`;
  }
});

function initPlatform() {
  setLang(currentLang);
}

function render() {
  if (!appData) return;
  const data = appData[currentLang];
  const q = searchQuery.trim().toLowerCase();

  // Sidebar Metadata Render
  document.getElementById('s-name').textContent = data.profile.name;
  document.getElementById('s-title').textContent = data.profile.title;
  document.getElementById('s-tagline').textContent = data.profile.subtitle;

  // Global Section Schema Labels
  document.getElementById('lbl-contact').textContent = data.labels.contact;
  document.getElementById('lbl-edu').textContent = data.labels.education;
  document.getElementById('lbl-skills').textContent = data.labels.skills;
  document.getElementById('lbl-langs').textContent = data.labels.languages;
  document.getElementById('lbl-profile').textContent = data.labels.profile;
  document.getElementById('lbl-exp').textContent = data.labels.experience;
  document.getElementById('flt-all').textContent = data.labels.filterAll;

  // Main Identity Architecture
  document.getElementById('m-name').innerHTML = data.profile.name;
  document.getElementById('m-role').textContent = data.profile.title;
  document.getElementById('m-summary').innerHTML = highlightText(data.profile.summary, q);

  // Business Performance Metrics Indicators
  document.getElementById('stats-container').innerHTML = data.stats.map(s => `
    <div class="text-center bg-white border border-gray-200 px-4 py-2 rounded shadow-sm min-w-[90px]">
      <div class="text-xl font-black text-[#0B132B] leading-none">${s.num}</div>
      <div class="text-[9px] font-bold text-gray-400 tracking-wider uppercase mt-1">${s.label}</div>
    </div>
  `).join('');

  // Contact Grid Compilation
  document.getElementById('contact-container').innerHTML = `
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">📍</span><span class="text-gray-300">${data.contact.location}</span></div>
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">✉</span><a href="mailto:${parseSecure(_e)}" class="text-gray-100 hover:text-[#F2BB05] transition-all">${parseSecure(_e)}</a></div>
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">☎</span><span class="text-gray-300">${parseSecure(_p)}</span></div>
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">💻</span><a href="https://${data.contact.github}" target="_blank" class="text-gray-100 hover:text-[#F2BB05] transition-all">${data.contact.github}</a></div>
    <div class="flex items-center gap-3"><span class="text-[#F2BB05] text-sm">👔</span><a href="https://${data.contact.linkedin}" target="_blank" class="text-gray-100 hover:text-[#F2BB05] transition-all">LinkedIn Profile</a></div>
  `;

  // Education Deployment Mapping
  document.getElementById('education-container').innerHTML = data.education.map(e => `
    <div class="border-l border-gray-600 pl-3 py-0.5">
      <div class="text-xs font-bold text-white leading-tight">${e.degree}</div>
      <div class="text-[11px] text-gray-400 mt-0.5">${e.school}</div>
      <div class="text-[10px] font-medium text-[#F2BB05] mt-1 tracking-wider">${e.year}</div>
      <div class="text-[10px] text-gray-500 font-light mt-0.5">${e.direction}</div>
    </div>
  `).join('');

  // Tech Skills Tags Deployment Injection
  document.getElementById('skills-container').innerHTML = data.skills.map(sk => {
    const isMatch = q && sk.toLowerCase().includes(q);
    return `
      <span class="text-[10px] font-medium px-2 py-1 rounded transition-all border ${
        isMatch 
          ? 'bg-[#F2BB05]/20 border-[#F2BB05] text-white font-bold scale-105 shadow-sm' 
          : 'bg-[#0B132B] border-gray-700 text-gray-400 hover:text-white'
      }">${highlightText(sk, q)}</span>
    `;
  }).join('');

  // Language Skills Indicator Bars Compilation
  document.getElementById('languages-container').innerHTML = data.languages.map(l => `
    <div>
      <div class="flex justify-between text-xs mb-1">
        <span class="text-white font-medium">${l.name}</span>
        <span class="text-gray-400 text-[11px] font-light tracking-wide">${l.level}</span>
      </div>
      <div class="w-full h-1.5 bg-[#0B132B] rounded-full overflow-hidden">
        <div class="h-full bg-[#F2BB05] rounded-full" style="width: ${l.pct}%"></div>
      </div>
    </div>
  `).join('');

  // Complex Pipeline Filter Engine (Filters Category AND Real-Time Queries)
  let visibleItemsCount = 0;
  document.getElementById('experience-container').innerHTML = data.experience.map(exp => {
    const matchesCategory = (activeCategory === 'all' || exp.category === activeCategory);
    
    // Evaluate text query compliance across fields
    const queryInHeader = exp.role.toLowerCase().includes(q) || exp.company.toLowerCase().includes(q);
    const validBullets = exp.bullets.filter(b => b.toLowerCase().includes(q));
    const queryInBullets = validBullets.length > 0;
    
    const matchesSearch = (!q || queryInHeader || queryInParagraphs(exp.bullets, q));
    const isVisible = matchesCategory && matchesSearch;

    if (isVisible) visibleItemsCount++;

    // Dynamic Bullets Presentation Mapping
    const compiledBullets = exp.bullets.map(b => {
      const bulletMatches = !q || b.toLowerCase().includes(q) || queryInHeader;
      return `<li class="flex items-start gap-2 text-xs text-gray-600 font-light leading-relaxed ${bulletMatches ? '' : 'opacity-30'}">
        <span class="text-[#0B132B] font-bold select-none mt-0.5">—</span>
        <span>${highlightText(b, q)}</span>
      </li>`;
    }).join('');

    // Media and Interactive Project Links Building Matrix
    const linksHtml = exp.links && exp.links.length > 0 ? `
      <div class="flex flex-wrap gap-2 mt-3 project-btn">
        ${exp.links.map(l => `
          <a href="${l.url}" target="_blank" class="bg-white border border-gray-300 hover:border-[#0B132B] text-[#0B132B] text-[10px] font-bold px-3 py-1.5 rounded flex items-center gap-1.5 shadow-sm transition-all">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            ${l.name}
          </a>
        `).join('')}
      </div>
    ` : '';

    const imageBoxHtml = exp.image ? `
      <div class="w-full sm:w-28 h-20 rounded overflow-hidden shadow-sm border border-gray-200 shrink-0 hidden sm:block bg-gray-100">
        <img src="${exp.image}" alt="Deployment Screenshot Preview" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-300" />
      </div>
    ` : '';

    return `
      <div class="bg-white border border-gray-200 rounded p-5 shadow-sm transition-all duration-300 flex flex-col sm:flex-row gap-4 hover:shadow-md ${isVisible ? 'flex' : '!hidden'}">
        ${imageBoxHtml}
        <div class="flex-1">
          <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-1 mb-2">
            <div>
              <h3 class="text-sm font-bold text-[#0B132B] flex items-center gap-2 flex-wrap">
                ${highlightText(exp.role, q)}
                <span class="text-xs bg-[#F2BB05]/20 text-[#0B132B] px-2 py-0.5 rounded font-semibold border border-[#F2BB05]/40">${highlightText(exp.company, q)}</span>
              </h3>
            </div>
            <div class="text-[10px] font-medium text-gray-400 tracking-wider uppercase">${exp.period}</div>
          </div>
          <ul class="space-y-2 mt-2">${compiledBullets}</ul>
          ${linksHtml}
        </div>
      </div>
    `;
  }).join('');

  // Handle Empty Search/Filter Engine Exceptions
  const noResultsNode = document.getElementById('no-results');
  if (visibleItemsCount === 0) {
    noResultsNode.classList.remove('hidden');
    noResultsNode.textContent = `${data.labels.noResults} "${searchQuery}"`;
  } else {
    noResultsNode.classList.add('hidden');
  }

  // Toggle Filters and Toolbar Classes Active States
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.getElementById(`flt-${activeCategory}`);
  if (activeBtn) activeBtn.classList.add('active');

  document.getElementById('btn-en').classList.toggle('bg-[#1C2541]', currentLang === 'en');
  document.getElementById('btn-en').classList.toggle('text-white', currentLang === 'en');
  document.getElementById('btn-el').classList.toggle('bg-[#1C2541]', currentLang === 'el');
  document.getElementById('btn-el').classList.toggle('text-white', currentLang === 'el');
  document.documentElement.lang = currentLang;
}

// Helper Verification Matrix Functions
function queryInParagraphs(arr, query) {
  return arr.some(text => text.toLowerCase().includes(query));
}

function highlightText(text, query) {
  if (!query) return text;
  const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escapedQuery})`, 'gi'), '<mark>$1</mark>');
}

// User Event Trigger Actions
function setLang(lang) {
  currentLang = lang;
  render();
}

function handleSearch(val) {
  searchQuery = val;
  render();
}

function filterCategory(cat) {
  activeCategory = cat;
  render();
}

// Client-Side Canvas Screenshot Engine Export Generation
async function exportPNG() {
  const overlay = document.getElementById('export-overlay');
  overlay.style.display = 'flex';
  await new Promise(resolve => setTimeout(resolve, 150));
  try {
    const canvas = await html2canvas(document.getElementById('resume-wrapper'), {
      scale: 2,
      useCORS: true,
      backgroundColor: '#F8F9FA',
      logging: false
    });
    const downloadAnchor = document.createElement('a');
    downloadAnchor.download = `Resume_${appData[currentLang].profile.name.replace(/\s+/g, '_')}.png`;
    downloadAnchor.href = canvas.toDataURL('image/png');
    downloadAnchor.click();
  } catch (error) {
    console.error("Canvas Render Failure: Unable to parse HTML elements tree into bitmap matrix.", error);
  }
  overlay.style.display = 'none';
}
</script>
</body>
</html>
